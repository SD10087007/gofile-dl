name: Gofile Downloader

on:
  workflow_dispatch:

jobs:
  download_file:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install Downloader
        run: pip install gofile-dl

      - name: Run Download
        run: |
          mkdir output
          cd output
          gofile-dl "https://gofile.io/d/a4eG302I"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-download
          path: output/
