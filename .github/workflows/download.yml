name: Gofile Downloader Fix

on:
  workflow_dispatch:

jobs:
  download_file:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Download
        run: |
          mkdir output
          cd output
          # This tells GitHub's server to pull the file directly using an unblocked connection
          curl -L -O "https://gofile.io/d/a4eG302I"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-download
          path: output/
